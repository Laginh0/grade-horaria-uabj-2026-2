<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Monte sua grade semanal, confira pré-requisitos e identifique conflitos de horário.">
  <title>Grade Horária 2026.2 | Engenharia de Computação</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("grade-uabj-theme");
        const preferred = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        document.documentElement.dataset.theme =
          saved === "dark" || saved === "light" ? saved : preferred;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <style>:root {
  --ink: #102033;
  --muted: #667486;
  --line: #dfe5ec;
  --paper: #ffffff;
  --canvas: #f3f5f8;
  --navy: #071727;
  --navy-soft: #10283d;
  --lime: #c7f36a;
  --row-height: 58px;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--canvas);
  color: var(--ink);
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
}

body {
  margin: 0;
  min-width: 320px;
  overflow-x: clip;
  background: var(--canvas);
}

button,
input {
  font: inherit;
}

button:focus-visible,
input:focus-visible,
.discipline-card:has(input:focus-visible) {
  outline: 3px solid #5d9df5;
  outline-offset: 2px;
}

.app-shell {
  min-height: 100vh;
}

.hero {
  position: relative;
  overflow: hidden;
  padding: 24px clamp(20px, 4vw, 64px) 38px;
  color: #f8fbff;
  background:
    radial-gradient(circle at 82% 10%, rgba(73, 130, 181, 0.23), transparent 26%),
    linear-gradient(135deg, #061422 0%, #0a2034 100%);
}

.hero::after {
  content: "";
  position: absolute;
  right: -70px;
  bottom: -118px;
  width: 330px;
  height: 330px;
  border: 1px solid rgba(199, 243, 106, 0.18);
  border-radius: 50%;
  box-shadow:
    0 0 0 48px rgba(199, 243, 106, 0.035),
    0 0 0 96px rgba(199, 243, 106, 0.025);
  pointer-events: none;
}

.brand-line {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: #b8c5d3;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.brand-identity {
  display: flex;
  align-items: center;
  gap: 10px;
}

.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 11px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 10px;
  color: #d9e3ec;
  background: rgba(255, 255, 255, 0.07);
  cursor: pointer;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: none;
}

.theme-toggle:hover {
  border-color: rgba(199, 243, 106, 0.45);
  color: #ffffff;
  background: rgba(255, 255, 255, 0.12);
}

.theme-icon {
  display: grid;
  width: 18px;
  height: 18px;
  place-items: center;
  border-radius: 50%;
  color: #183017;
  background: var(--lime);
  font-size: 12px;
  line-height: 1;
}

.brand-mark {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border: 1px solid rgba(199, 243, 106, 0.6);
  border-radius: 10px;
  color: var(--lime);
  font-size: 12px;
  letter-spacing: -0.02em;
}

.hero-content {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  max-width: 1600px;
  margin: 30px auto 0;
}

.eyebrow,
.panel-kicker {
  margin: 0 0 8px;
  color: var(--lime);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.hero h1 {
  max-width: 690px;
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(36px, 5vw, 66px);
  font-weight: 500;
  line-height: 0.98;
  letter-spacing: -0.045em;
}

.hero-copy {
  max-width: 600px;
  margin: 18px 0 0;
  color: #b9c6d3;
  font-size: 16px;
  line-height: 1.55;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(145px, 1fr));
  gap: 10px;
  min-width: 560px;
}

.stat-card {
  min-height: 105px;
  padding: 18px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.055);
  backdrop-filter: blur(8px);
}

.stat-card strong {
  display: block;
  margin-bottom: 5px;
  color: #ffffff;
  font-size: 32px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.stat-card span {
  display: block;
  color: #bdc9d5;
  font-size: 12px;
  line-height: 1.35;
}

.stat-card-accent {
  border-color: rgba(199, 243, 106, 0.28);
  background: var(--lime);
}

.stat-card-accent strong,
.stat-card-accent span {
  color: #183017;
}

.stat-card-completed {
  border-color: rgba(126, 203, 161, 0.3);
  background: rgba(77, 151, 112, 0.16);
}

.workspace {
  display: grid;
  grid-template-columns: minmax(300px, 350px) minmax(0, 1fr);
  gap: 18px;
  max-width: 1700px;
  margin: 0 auto;
  padding: 20px;
}

.catalog-panel,
.calendar-panel {
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--paper);
  box-shadow: 0 16px 44px rgba(15, 34, 53, 0.065);
}

.catalog-panel {
  align-self: start;
  position: sticky;
  top: 18px;
  padding: 20px 8px 8px 20px;
}

.panel-heading,
.calendar-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.panel-heading {
  flex-wrap: wrap;
}

.panel-actions {
  display: flex;
  flex: 1 0 100%;
  flex-wrap: wrap;
  gap: 6px;
}

.panel-kicker {
  margin-bottom: 3px;
  color: #638315;
  font-size: 10px;
}

.panel-heading h2,
.calendar-heading h2 {
  margin: 0;
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 27px;
  font-weight: 500;
  letter-spacing: -0.025em;
}

.clear-button {
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  color: #526173;
  background: #ffffff;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.clear-button:hover {
  border-color: #b9c4cf;
  background: #f5f7f9;
}

.file-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 0;
  padding: 7px 10px;
  border: 1px solid #cbd5de;
  border-radius: 9px;
  color: #23384c;
  background: #edf2f6;
  cursor: pointer;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.file-button span {
  font-size: 15px;
  line-height: 1;
}

.file-button:hover {
  border-color: #9eacba;
  background: #e4ebf1;
}

.file-input {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  clip-path: inset(50%);
}

.progress-backup {
  display: flex;
  align-items: stretch;
  flex-direction: column;
  gap: 10px;
  margin: -4px 12px 14px 0;
  padding: 11px 12px;
  border: 1px solid #d6e1ea;
  border-radius: 11px;
  background: #f6f9fb;
}

.progress-backup-copy {
  display: grid;
  gap: 3px;
  min-width: 0;
}

.progress-backup-copy strong {
  color: #263c50;
  font-size: 12px;
}

.progress-backup-copy span {
  max-width: none;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.35;
}

.progress-backup-actions {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 7px;
}

.catalog-help {
  margin: 13px 12px 16px 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

.file-message {
  margin: -7px 12px 13px 0;
  padding: 7px 9px;
  border-radius: 8px;
  color: #39546b;
  background: #edf4f8;
  font-size: 10px;
  font-weight: 700;
}

.autosave-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: -8px 12px 13px 0;
  color: #657483;
  font-size: 9px;
  font-weight: 800;
}

.autosave-indicator span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #58a46f;
  box-shadow: 0 0 0 3px rgba(88, 164, 111, 0.13);
}

.catalog-tabs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px;
  margin: 0 10px 14px 0;
  padding: 4px;
  border: 1px solid #dfe5eb;
  border-radius: 11px;
  background: #f2f5f7;
}

.catalog-tabs button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-width: 0;
  padding: 7px 5px;
  border: 0;
  border-radius: 7px;
  color: #667586;
  background: transparent;
  cursor: pointer;
  font-size: 9px;
  font-weight: 800;
  line-height: 1.15;
}

.catalog-tabs button:hover {
  color: #263a4d;
  background: rgba(255, 255, 255, 0.68);
}

.catalog-tabs button.is-active {
  color: #1d342c;
  background: #ffffff;
  box-shadow: 0 2px 7px rgba(27, 46, 64, 0.1);
}

.catalog-tabs button span {
  display: grid;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  place-items: center;
  border-radius: 20px;
  color: #5c6b79;
  background: #e2e8ed;
  font-size: 8px;
  font-variant-numeric: tabular-nums;
}

.catalog-tabs button.is-active span {
  color: #34550e;
  background: #dff0c3;
}

.discipline-list {
  max-height: calc(100vh - 247px);
  min-height: 0;
  padding-right: 10px;
  overflow-y: auto;
  overscroll-behavior: contain;
  contain: layout paint;
  scrollbar-gutter: stable;
  scrollbar-color: #cdd5de transparent;
  scrollbar-width: thin;
}

.tab-empty-state {
  margin: 4px 2px;
  padding: 22px 16px;
  border: 1px dashed #cbd4dd;
  border-radius: 12px;
  text-align: center;
  background: #f8fafb;
}

.tab-empty-state strong {
  display: block;
  color: #34485b;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 15px;
  font-weight: 500;
}

.tab-empty-state p {
  margin: 6px 0 0;
  color: #758393;
  font-size: 10px;
  line-height: 1.4;
}

.period-group + .period-group {
  margin-top: 20px;
}

.period-heading {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 2px 9px;
}

.period-heading h3 {
  margin: 0;
  color: #5d6b7a;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.period-heading span {
  display: grid;
  min-width: 19px;
  height: 19px;
  padding: 0 5px;
  place-items: center;
  border-radius: 20px;
  color: #667485;
  background: #edf1f4;
  font-size: 10px;
  font-weight: 800;
}

.period-items {
  display: grid;
  gap: 8px;
}

.discipline-card {
  --event-color: hsl(var(--hue) 63% 46%);
  display: block;
  padding: 12px;
  border: 1px solid #e2e7ed;
  border-left: 4px solid hsl(var(--hue) 61% 52%);
  border-radius: 12px;
  background: #ffffff;
  transition:
    transform 150ms ease,
    border-color 150ms ease,
    background 150ms ease,
    box-shadow 150ms ease;
}

.schedule-choice {
  display: grid;
  grid-template-columns: 19px minmax(0, 1fr);
  gap: 11px;
  cursor: pointer;
}

.discipline-card:hover {
  transform: translateY(-1px);
  border-color: hsl(var(--hue) 38% 70%);
  box-shadow: 0 7px 18px rgba(18, 37, 56, 0.08);
}

.discipline-card.is-selected {
  border-color: hsl(var(--hue) 47% 61%);
  background: hsl(var(--hue) 65% 97%);
  box-shadow: inset 0 0 0 1px hsl(var(--hue) 38% 82%);
}

.discipline-card.is-completed {
  border-color: #7ab996;
  border-left-color: #35815b;
  background: #f1faf5;
}

.discipline-card.is-locked {
  border-left-color: #aab4be;
  background: #fafbfc;
}

.schedule-choice:has(input:disabled) {
  cursor: not-allowed;
}

.schedule-choice:has(input:disabled) .discipline-copy {
  opacity: 0.72;
}

.schedule-choice > input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.check-visual {
  display: grid;
  width: 19px;
  height: 19px;
  margin-top: 1px;
  place-items: center;
  border: 1.5px solid #b6c1cc;
  border-radius: 6px;
  color: transparent;
  background: #ffffff;
  font-size: 11px;
  font-weight: 900;
  transition: 150ms ease;
}

.discipline-card.is-selected .check-visual {
  border-color: hsl(var(--hue) 62% 38%);
  color: #ffffff;
  background: hsl(var(--hue) 62% 38%);
}

.discipline-card.is-completed .check-visual,
.discipline-card.is-locked .check-visual {
  border-color: #c8d0d8;
  color: transparent;
  background: #eef1f4;
}

.discipline-copy {
  display: block;
  min-width: 0;
}

.discipline-copy strong,
.discipline-copy span,
.discipline-copy small {
  display: block;
}

.prerequisite-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px solid rgba(177, 189, 200, 0.42);
}

.completed-check {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 5px;
  color: #445668;
  cursor: pointer;
  font-size: 10px;
  font-weight: 800;
}

.completed-check input {
  width: 14px;
  height: 14px;
  margin: 0;
  accent-color: #287c52;
}

.status-pill {
  max-width: 62%;
  padding: 3px 6px;
  border-radius: 6px;
  color: #6b7885;
  background: #edf0f3;
  font-size: 9px;
  font-weight: 800;
  line-height: 1.25;
  text-align: right;
}

.status-completed {
  color: #256243;
  background: #dff3e7;
}

.status-ready {
  color: #3d671a;
  background: #e8f3d9;
}

.status-locked {
  color: #8b2d38;
  background: #fde8eb;
}

.requirement-note {
  margin: 7px 0 0;
  padding: 6px 8px;
  border-radius: 7px;
  color: #75561e;
  background: #fff5dc;
  font-size: 9px;
  font-weight: 700;
  line-height: 1.3;
}

.discipline-copy strong {
  color: #1b2b3c;
  font-size: 13px;
  line-height: 1.28;
}

.elective-badge {
  display: inline-flex;
  margin-left: 6px;
  padding: 2px 5px;
  transform: translateY(-1px);
  border-radius: 5px;
  color: #67501b;
  background: #f4e7b9;
  font-size: 8px;
  font-style: normal;
  font-weight: 900;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  white-space: nowrap;
}

.discipline-copy span {
  margin-top: 4px;
  overflow: hidden;
  color: #5e6c7b;
  font-size: 11px;
  line-height: 1.3;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.discipline-copy .discipline-room {
  color: #788491;
}

.discipline-copy small {
  margin-top: 7px;
  color: #526172;
  font-size: 10px;
  font-weight: 700;
  line-height: 1.35;
}

.change-offering-button {
  width: 100%;
  margin-top: 9px;
  padding: 7px 8px;
  border: 1px solid hsl(var(--hue) 36% 74%);
  border-radius: 7px;
  color: hsl(var(--hue) 45% 29%);
  background: hsl(var(--hue) 62% 95%);
  cursor: pointer;
  font-size: 9px;
  font-weight: 900;
}

.change-offering-button:hover {
  border-color: hsl(var(--hue) 46% 61%);
  background: hsl(var(--hue) 62% 92%);
}

.calendar-panel {
  align-self: start;
  min-width: 0;
  padding: 22px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  color: #637181;
  font-size: 11px;
  font-weight: 700;
}

.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend-dot,
.legend-conflict {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

.legend-dot {
  background: #82aedd;
}

.legend-conflict {
  border: 2px solid #c93a49;
  background: #ffe3e6;
}

.conflict-alert,
.conflict-clear {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  margin-top: 16px;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 12px;
}

.conflict-alert {
  max-height: 148px;
  overflow-y: auto;
  border: 1px solid #f0adb4;
  color: #73212a;
  background: #fff0f2;
}

.alert-icon {
  display: grid;
  flex: 0 0 23px;
  width: 23px;
  height: 23px;
  place-items: center;
  border-radius: 50%;
  color: #ffffff;
  background: #c93545;
  font-weight: 900;
}

.conflict-alert strong {
  display: block;
  margin: 2px 0 4px;
}

.conflict-alert ul {
  margin: 0;
  padding-left: 16px;
  line-height: 1.45;
}

.conflict-alert li + li {
  margin-top: 3px;
}

.conflict-alert li span {
  color: #9a4350;
}

.conflict-clear {
  align-items: center;
  border: 1px solid #dfe8d1;
  color: #52683d;
  background: #f5f9ee;
}

.conflict-clear span {
  display: grid;
  width: 21px;
  height: 21px;
  place-items: center;
  border-radius: 50%;
  color: #315314;
  background: #dcedc5;
  font-weight: 900;
}

.calendar-scroll {
  margin-top: 14px;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  border: 1px solid #dbe2e9;
  border-radius: 14px;
  background: #ffffff;
  scrollbar-color: #c3cdd7 #eef1f4;
  scrollbar-width: thin;
}

.mobile-scroll-hint {
  display: none;
}

.calendar {
  position: relative;
  display: grid;
  grid-template-columns: 112px repeat(5, minmax(144px, 1fr));
  grid-template-rows: 50px repeat(12, var(--row-height));
  min-width: 916px;
  overflow: hidden;
}

.calendar-corner,
.day-heading {
  position: sticky;
  top: 0;
  z-index: 4;
  display: grid;
  place-items: center;
  border-bottom: 1px solid #cfd8e1;
  background: #f6f8fa;
}

.calendar-corner {
  grid-column: 1;
  grid-row: 1;
  color: #758292;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.day-heading {
  color: #25374a;
  font-size: 12px;
  font-weight: 800;
}

.day-heading span {
  display: none;
}

.day-heading:nth-of-type(2) {
  grid-column: 2;
}

.day-heading:nth-of-type(3) {
  grid-column: 3;
}

.day-heading:nth-of-type(4) {
  grid-column: 4;
}

.day-heading:nth-of-type(5) {
  grid-column: 5;
}

.day-heading:nth-of-type(6) {
  grid-column: 6;
}

.calendar-row {
  display: contents;
}

.time-label {
  position: relative;
  z-index: 2;
  display: grid;
  grid-column: 1;
  place-items: center;
  border-right: 1px solid #d9e0e7;
  border-bottom: 1px solid #e4e9ee;
  color: #34485d;
  background: #fafbfc;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.time-label strong {
  font-size: 13px;
  font-weight: 750;
  letter-spacing: -0.01em;
}

.hour-cell {
  border-right: 1px solid #e3e8ed;
  border-bottom: 1px solid #e3e8ed;
  background: #ffffff;
}

.hour-cell:nth-child(odd) {
  background: #fcfdfe;
}

.events-layer {
  position: absolute;
  z-index: 3;
  top: 50px;
  right: 0;
  bottom: 0;
  left: 112px;
  pointer-events: none;
}

.class-event {
  position: absolute;
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 7px 30px 7px 8px;
  overflow: hidden;
  border: 1px solid hsl(var(--hue) 54% 48%);
  border-left-width: 4px;
  border-radius: 8px;
  color: hsl(var(--hue) 40% 17%);
  background: hsl(var(--hue) 72% 91%);
  box-shadow: 0 3px 10px rgba(22, 39, 56, 0.11);
  pointer-events: auto;
}

.event-remove-button {
  position: absolute;
  z-index: 5;
  top: 4px;
  right: 4px;
  display: grid;
  width: 22px;
  height: 22px;
  padding: 0;
  place-items: center;
  border: 1px solid rgba(180, 35, 51, 0.28);
  border-radius: 50%;
  color: #b42333;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 2px 7px rgba(91, 16, 25, 0.16);
  cursor: pointer;
  font: inherit;
  font-size: 17px;
  font-weight: 900;
  line-height: 1;
  opacity: 0;
  pointer-events: auto;
  transform: scale(0.72);
  transition:
    opacity 140ms ease,
    transform 140ms ease,
    background-color 140ms ease;
}

.class-event:hover .event-remove-button,
.class-event:focus-within .event-remove-button {
  opacity: 1;
  transform: scale(1);
}

.event-remove-button:hover {
  color: #ffffff;
  background: #b42333;
}

.event-remove-button:focus-visible {
  outline: 3px solid rgba(180, 35, 51, 0.3);
  outline-offset: 2px;
}

@media (hover: none) {
  .event-remove-button {
    opacity: 0.82;
    transform: scale(1);
  }
}

.class-event strong {
  display: -webkit-box;
  margin-top: 4px;
  overflow: hidden;
  font-size: 11px;
  line-height: 1.16;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}

.class-event span {
  display: block;
  margin-top: 4px;
  overflow: hidden;
  font-size: 9px;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.class-event .event-time {
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.02em;
}

.class-event .event-room {
  margin-top: auto;
  padding-top: 3px;
  font-weight: 800;
}

.class-event em {
  position: absolute;
  right: 5px;
  bottom: 5px;
  padding: 2px 4px;
  border-radius: 4px;
  color: #ffffff;
  background: #bd2e3c;
  font-size: 8px;
  font-style: normal;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.class-event.has-conflict {
  z-index: 2;
  border: 3px solid #c92f40;
  color: #5b1019;
  background:
    repeating-linear-gradient(
      -45deg,
      rgba(255, 255, 255, 0.28),
      rgba(255, 255, 255, 0.28) 7px,
      rgba(201, 47, 64, 0.08) 7px,
      rgba(201, 47, 64, 0.08) 14px
    ),
    #ffdfe3;
  animation: conflict-pulse 1.4s ease-in-out infinite;
}

.empty-calendar {
  position: absolute;
  z-index: 2;
  top: 235px;
  left: calc(50% + 56px);
  width: min(330px, 55%);
  padding: 24px;
  transform: translateX(-50%);
  border: 1px dashed #cbd4dd;
  border-radius: 15px;
  text-align: center;
  background: rgba(255, 255, 255, 0.94);
}

.empty-icon {
  display: grid;
  width: 38px;
  height: 38px;
  margin: 0 auto 11px;
  place-items: center;
  border-radius: 11px;
  color: #416319;
  background: #e3f2ca;
  font-size: 24px;
  font-weight: 300;
}

.empty-calendar strong {

  font-size: 18px;
  font-weight: 500;
}

.empty-calendar p {

  line-height: 1.45;
}

.source-note {
  margin: 10px 2px 0;

}

.offering-modal-backdrop {
  position: fixed;
  z-index: 50;
  inset: 0;
  display: grid;
  padding: 20px;
  place-items: center;
  overflow-y: auto;
  background: rgba(4, 13, 22, 0.7);
  backdrop-filter: blur(7px);
}

.offering-modal {
  position: relative;
  width: min(520px, 100%);
  max-height: calc(100vh - 40px);
  padding: 24px;
  overflow-y: auto;
  border: 1px solid #d9e1e8;
  border-radius: 18px;
  color: var(--ink);
  background: var(--paper);
  box-shadow: 0 28px 80px rgba(3, 16, 27, 0.32);
}

.offering-modal h2 {
  margin: 0;
  padding-right: 34px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.025em;
}

.modal-close {
  position: absolute;
  top: 17px;
  right: 17px;
  display: grid;
  width: 32px;
  height: 32px;
  padding: 0;
  place-items: center;
  border: 1px solid #d8e0e7;
  border-radius: 9px;
  color: #506172;
  background: #f5f7f9;

  font-size: 21px;

}

.modal-close:hover {

}

.modal-description {
  margin: 10px 0 17px;

  line-height: 1.5;
}

.offering-options {
  display: grid;
  gap: 9px;
}

.offering-option {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: 11px;
  width: 100%;
  padding: 13px;
  border: 1px solid #dbe2e8;
  border-radius: 12px;
  color: #203448;
  background: #ffffff;

  text-align: left;
}

.offering-option:hover {

}

.offering-option:disabled {
  border-color: #e0c5c9;
  background: #faf3f4;
  cursor: not-allowed;
  opacity: 0.72;
}

.offering-option.is-current {
  border-color: #729b3e;
  background: #f3f9e9;
  box-shadow: inset 0 0 0 1px #d8e9be;
}

.offering-check {
  display: grid;
  width: 22px;
  height: 22px;
  place-items: center;
  border: 1px solid #bac6d0;
  border-radius: 7px;
  color: #ffffff;
  background: #ffffff;
  font-size: 11px;

}

.offering-option.is-current .offering-check {
  border-color: #5e8a2b;
  background: #6f9e37;
}

.offering-copy strong,
.offering-copy span,
.offering-copy small,
.offering-copy em,
.offering-copy b {

}

.offering-copy strong {

}

.offering-copy em {

  font-style: normal;
  font-weight: 800;
  text-transform: uppercase;
}

.offering-copy span {
  margin-top: 7px;
  color: #4d5e6e;
  font-size: 11px;
  font-weight: 800;
}

.offering-copy small {
  margin-top: 4px;
  color: #7a8794;
  font-size: 10px;
}

.offering-copy .offering-compatibility {
  width: fit-content;
  margin-top: 7px;
  padding: 3px 6px;
  border-radius: 5px;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.offering-compatibility.is-compatible {
  color: #346019;
  background: #e2f1cf;
}

.offering-compatibility.is-conflicting {
  color: #8c2f3a;

  .progress-backup,
  .catalog-tabs,
  .autosave-indicator,
  .file-message {
    margin-right: 8px;
  }

  .calendar-panel {
    margin-top: 8px;
    padding: 14px 10px 12px;
  }

  .mobile-scroll-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 11px 2px -5px;
    color: #778492;
    font-size: 10px;
    font-weight: 750;
  }

  .mobile-scroll-hint span {
    color: #57771c;
    font-size: 15px;
  }

  .calendar {
    grid-template-columns: 92px repeat(5, 116px);
    min-width: 672px;
  }

  .events-layer {
    left: 92px;
  }

  .empty-calendar {
    left: calc(50% + 46px);
  }

  .time-label strong {
    font-size: 11px;
  }

  .day-heading {
    font-size: 0;
  }

  .day-heading span {
    display: block;
    font-size: 11px;
  }
}
</style>
